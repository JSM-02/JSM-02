    .tag { fill: #ffa657; font-size: 13px; }
    .title { fill: #8b949e; font-size: 12px; }
    .a { opacity: 0; animation: in .25s ease forwards; }
    .cur { opacity: 0; animation: in .1s 3.6s forwards, blink 1s 3.7s step-end infinite; }
    @keyframes in { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="c1"><rect x="68" y="60" height="26" width="0"><animate attributeName="width" from="0" to="60" begin="0.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
