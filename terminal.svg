<svg xmlns="http://www.w3.org/2000/svg" width="840" height="318" viewBox="0 0 840 318">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #e6edf3; }
    .mut { fill: #8b949e; }
    .dir { fill: #79c0ff; font-weight: 600; }
